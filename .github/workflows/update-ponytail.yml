name: Update Ponytail Skill
on:
  schedule:
    - cron: '0 3 * * 1'  # Poniedziałek 3:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ponytail AGENTS.md
        run: |
          mkdir -p .ponytail
          curl -fsSL https://raw.githubusercontent.com/DietrichGebert/ponytail/main/AGENTS.md > /tmp/agents.md

          cat > .ponytail/SKILL.md << 'EOF'
          ---
          name: ponytail
          description: Lazy senior developer mode - write minimal, reusable, correct code
          ---

          EOF
          cat /tmp/agents.md >> .ponytail/SKILL.md

      - name: Sync do wspólnego folderu agentów (Claude Code, Codex)
        run: |
          mkdir -p .agents/skills/ponytail
          cp .ponytail/SKILL.md .agents/skills/ponytail/SKILL.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ponytail/SKILL.md .agents/skills/ponytail/SKILL.md
          git diff-index --quiet HEAD || git commit -m "chore: aktualizacja reguł ponytail do najnowszej wersji"
          git pull --rebase origin main
          git push
