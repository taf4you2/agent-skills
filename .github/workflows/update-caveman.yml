name: Auto Update Caveman Rules

on:
  schedule:
    - cron: '0 0 * * 1' # Uruchamia proces automatycznie w każdy poniedziałek o 00:00
  workflow_dispatch: # Pozwala na ręczne kliknięcie "Run workflow" w zakładce Actions

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Pobranie najnowszych reguł SKILL.md
        run: |
          mkdir -p .caveman
          curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/caveman/main/skills/caveman/SKILL.md -o .caveman/SKILL.md

      - name: Automatyczny commit zmian
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .caveman/SKILL.md
          # Commituje tylko wtedy, gdy plik na GitHubie autora rzeczywiście się zmienił
          git diff-index --quiet HEAD || git commit -m "chore: aktualizacja reguł caveman do najnowszej wersji"
          git push

