name: Auto Update Source Driven Development Rules

on:
  workflow_dispatch: # Odpalane co tydzień przez dispatcher z main (.github/workflows/trigger-sync.yml) lub ręcznie

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pobranie najnowszych reguł SKILL.md
        run: |
          mkdir -p .source-driven-development
          curl -fsSL https://raw.githubusercontent.com/addyosmani/agent-skills/main/skills/source-driven-development/SKILL.md -o .source-driven-development/SKILL.md

      - name: Sync do wspólnego folderu agentów (Claude Code, Codex)
        run: |
          mkdir -p .agents/skills/source-driven-development
          cp .source-driven-development/SKILL.md .agents/skills/source-driven-development/SKILL.md

      - name: Automatyczny commit zmian
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .source-driven-development/SKILL.md .agents/skills/source-driven-development/SKILL.md
          # Commituje tylko wtedy, gdy plik na GitHubie autora rzeczywiście się zmienił
          git diff-index --quiet HEAD || git commit -m "chore: aktualizacja reguł source-driven-development do najnowszej wersji"
          git pull --rebase origin main
          git push
</content>
