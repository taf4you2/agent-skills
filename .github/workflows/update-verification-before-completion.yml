name: Auto Update Verification Before Completion Rules

on:
  workflow_dispatch: # Odpalane co tydzień przez dispatcher z main (.github/workflows/trigger-sync.yml) lub ręcznie

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pobranie najnowszych reguł SKILL.md
        run: |
          mkdir -p .verification-before-completion
          curl -fsSL https://raw.githubusercontent.com/obra/superpowers/main/skills/verification-before-completion/SKILL.md -o .verification-before-completion/SKILL.md

      - name: Sync do wspólnego folderu agentów (Claude Code, Codex)
        run: |
          mkdir -p .agents/skills/verification-before-completion
          cp .verification-before-completion/SKILL.md .agents/skills/verification-before-completion/SKILL.md

      - name: Automatyczny commit zmian
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .verification-before-completion/SKILL.md .agents/skills/verification-before-completion/SKILL.md
          # Commituje tylko wtedy, gdy plik na GitHubie autora rzeczywiście się zmienił
          git diff-index --quiet HEAD || git commit -m "chore: aktualizacja reguł verification-before-completion do najnowszej wersji"
          git pull --rebase origin main
          git push
